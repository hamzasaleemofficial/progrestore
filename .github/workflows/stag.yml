name: Staging CI/CD

on:
  push:
    branches:
      - stag
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: eu-west-1
  AWS_ACCOUNT_ID: "322056173622"
  FRONTEND_REPOSITORY: stag-frontend
  BACKEND_REPOSITORY: stag-backend

jobs:
  deploy:
    name: Build, Scan and Deploy Staging
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_STAG }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Verify staging ECR repositories
        run: |
          aws ecr describe-repositories \
            --repository-names "$FRONTEND_REPOSITORY" "$BACKEND_REPOSITORY" \
            --region "$AWS_REGION"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Set image tags
        id: images
        run: |
          echo "frontend=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$FRONTEND_REPOSITORY:$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "backend=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$BACKEND_REPOSITORY:$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Build frontend image
        run: |
          docker build \
            -t "${{ steps.images.outputs.frontend }}" \
            ./frontend

      - name: Build backend image
        run: |
          docker build \
            -t "${{ steps.images.outputs.backend }}" \
            ./backend

      - name: Scan frontend image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.images.outputs.frontend }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Scan backend image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.images.outputs.backend }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Push frontend image
        run: docker push "${{ steps.images.outputs.frontend }}"

      - name: Push backend image
        run: docker push "${{ steps.images.outputs.backend }}"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: terraform/environments/stag
        run: terraform init

      - name: Terraform Validate
        working-directory: terraform/environments/stag
        run: terraform validate

      - name: Terraform Plan
        working-directory: terraform/environments/stag
        run: |
          terraform plan \
            -input=false \
            -var-file=terraform.tfvars.example \
            -out=stag.tfplan \
            -var="frontend_image=${{ steps.images.outputs.frontend }}" \
            -var="backend_image=${{ steps.images.outputs.backend }}"

      - name: Terraform Apply
        working-directory: terraform/environments/stag
        run: terraform apply -auto-approve stag.tfplan
        
      - name: Run database provisioning task
        id: database_init
        shell: bash
        run: |
          set -euo pipefail

          ECS_CLUSTER="stag-ecs-cluster"
          BACKEND_SERVICE="stag-backend"
          INITIALIZER_TASK="stag-database-initializer"

          echo "Getting network configuration from the backend service..."

          NETWORK_CONFIGURATION=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$BACKEND_SERVICE" \
            --query 'services[0].networkConfiguration' \
            --output json)

          if [ "$NETWORK_CONFIGURATION" = "null" ] || [ -z "$NETWORK_CONFIGURATION" ]; then
            echo "ERROR: Could not retrieve backend network configuration."
            exit 1
          fi

          echo "Getting initializer task definition..."

          TASK_DEFINITION=$(aws ecs describe-task-definition \
            --task-definition "$INITIALIZER_TASK" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          if [ -z "$TASK_DEFINITION" ] || [ "$TASK_DEFINITION" = "None" ]; then
            echo "ERROR: Initializer task definition not found."
            exit 1
          fi

          echo "Launching one-off database initializer..."

          RUN_RESPONSE=$(aws ecs run-task \
            --cluster "$ECS_CLUSTER" \
            --task-definition "$TASK_DEFINITION" \
            --launch-type FARGATE \
            --network-configuration "$NETWORK_CONFIGURATION" \
            --count 1 \
            --output json)

          echo "$RUN_RESPONSE" | jq .

          FAILURE_COUNT=$(echo "$RUN_RESPONSE" | jq '.failures | length')

          if [ "$FAILURE_COUNT" -gt 0 ]; then
            echo "ERROR: ECS could not start the initializer task."
            exit 1
          fi

          TASK_ARN=$(echo "$RUN_RESPONSE" | jq -r '.tasks[0].taskArn')

          if [ -z "$TASK_ARN" ] || [ "$TASK_ARN" = "null" ]; then
            echo "ERROR: ECS did not return an initializer task ARN."
            exit 1
          fi

          echo "Initializer task: $TASK_ARN"
          echo "Waiting for database initialization to finish..."

          aws ecs wait tasks-stopped \
            --cluster "$ECS_CLUSTER" \
            --tasks "$TASK_ARN"

          TASK_EXIT_CODE=$(aws ecs describe-tasks \
            --cluster "$ECS_CLUSTER" \
            --tasks "$TASK_ARN" \
            --query "tasks[0].containers[?name=='database-initializer'].exitCode | [0]" \
            --output text)

          echo "Initializer exit code: $TASK_EXIT_CODE"

          if [ "$TASK_EXIT_CODE" != "0" ]; then
            echo "ERROR: Database initialization failed."
            aws ecs describe-tasks \
              --cluster "$ECS_CLUSTER" \
              --tasks "$TASK_ARN" \
              --query 'tasks[0].{LastStatus:lastStatus,StopCode:stopCode,StoppedReason:stoppedReason,Containers:containers[*].{Name:name,ExitCode:exitCode,Reason:reason}}' \
              --output json
            exit 1
          fi

          echo "Database initialization succeeded."

      - name: Restart backend after database provisioning
        run: |
          set -euo pipefail

          aws ecs update-service \
            --cluster stag-ecs-cluster \
            --service stag-backend \
            --force-new-deployment

          echo "Waiting for the backend service to stabilize..."

          aws ecs wait services-stable \
            --cluster stag-ecs-cluster \
            --services stag-backend

          echo "Backend deployment completed."