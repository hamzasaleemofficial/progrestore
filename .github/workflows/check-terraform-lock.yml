name: Check Terraform State Lock

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to inspect"
        required: true
        type: choice
        options:
          - dev
          - stag
          - prod

permissions:
  contents: read
  id-token: write

jobs:
  check-lock:
    name: Inspect ${{ inputs.environment }} state lock
    runs-on: ubuntu-24.04

    steps:
      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-region: eu-west-1
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Inspect Terraform state and lock objects
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail

          BUCKET="${ENVIRONMENT}-postgrestore-terraform-remote-backend"

          echo "Checking Terraform state object..."

          aws s3api head-object \
            --bucket "$BUCKET" \
            --key terraform.tfstate

          echo ""
          echo "Checking Terraform lock object..."

          if aws s3api head-object \
            --bucket "$BUCKET" \
            --key terraform.tfstate.tflock; then

            echo "Lock object exists."

            aws s3api get-object \
              --bucket "$BUCKET" \
              --key terraform.tfstate.tflock \
              /tmp/terraform-lock.json

            echo "Lock information:"
            cat /tmp/terraform-lock.json

          else
            echo "No lock object found at this key."
          fi

          echo ""
          echo "Checking objects in the Terraform backend bucket..."

          aws s3api list-objects-v2 \
            --bucket "$BUCKET" \
            --prefix terraform.tfstate \
            --query 'Contents[].{Key:Key,LastModified:LastModified,Size:Size}' \
            --output table