name: Check Terraform State Lock

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to inspect"
        required: true
        type: choice
        options:
          - dev
          - stag
          - prod

permissions:
  contents: read
  id-token: write

jobs:
  check-lock:
    name: Inspect ${{ inputs.environment }} state lock
    runs-on: ubuntu-24.04

    steps:
      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-region: eu-west-1
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Inspect S3 lock object
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail

          BUCKET="${ENVIRONMENT}-postgrestore-terraform-remote-backend"
          KEY="terraform.tfstate.tflock"

          echo "Checking s3://${BUCKET}/${KEY}"

          if aws s3api head-object \
            --bucket "$BUCKET" \
            --key "$KEY"; then
            echo "Lock object exists. No changes have been made."
          else
            echo "Unable to inspect the lock object."
            exit 1
          fi

      - name: Read lock information
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail

          BUCKET="${ENVIRONMENT}-postgrestore-terraform-remote-backend"

          aws s3api get-object \
            --bucket "$BUCKET" \
            --key terraform.tfstate.tflock \
            /tmp/terraform-lock.json

          echo "Terraform lock information:"
          cat /tmp/terraform-lock.json